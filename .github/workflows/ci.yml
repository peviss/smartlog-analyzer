# Lint, tests against a real PostgreSQL, and a build + smoke test of the Docker stack.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["landing/**", "**.md", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["landing/**", "**.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13" # same as the Dockerfile

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff (version pinned in requirements-dev.txt)
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check . --output-format=github
      - run: ruff format --check .

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine # same as docker-compose.yml
        env:
          POSTGRES_USER: smartlog
          POSTGRES_PASSWORD: smartlog
          POSTGRES_DB: smartlog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartlog -d smartlog_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://smartlog:smartlog@localhost:5432/smartlog_test
      # Fail instead of skipping the integration tests if the database is unreachable.
      REQUIRE_TEST_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v -ra

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for compose
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-$(openssl rand -hex 12)/" .env
          # Load sample data so the smoke test can check the full read path.
          sed -i "s/^SEED_ON_START=.*/SEED_ON_START=true/" .env

      - name: Build images
        run: docker compose build

      - name: Start the stack (waits for the healthchecks)
        run: docker compose up -d --wait --wait-timeout 120

      - name: Smoke test through nginx
        run: |
          set -eu
          base=http://localhost:8080

          echo "--- /api/health"
          curl -fsS "$base/api/health" | tee /dev/stderr | jq -e '.status == "ok" and .database == "ok"'

          echo "--- /api/logs (seeded data)"
          curl -fsS "$base/api/logs?limit=1" | jq -e '.page.total > 0 and (.items | length) == 1'

          echo "--- web UI"
          curl -fsS "$base/" | grep -qi '<div id="root"\|<!doctype html'

          echo "--- OpenAPI docs"
          curl -fsS -o /dev/null "$base/openapi.json"

      - name: Show logs on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
