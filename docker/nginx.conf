# Single public entry point: serves the web UI and proxies the API. Request size
# limit, basic rate limiting for the API and a longer timeout for LLM analysis.

limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# Keep the client's X-Request-ID if it sent one, otherwise generate one.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream smartlog_api {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;   # a 1000-log batch fits comfortably
    server_tokens off;

    # Shared proxy settings for every API location.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $req_id;

    # ---- API ----
    location /api/ {
        limit_req zone=api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://smartlog_api;
        proxy_read_timeout 30s;
    }

    # The analysis endpoint waits for the LLM: allow more than LLM_TIMEOUT_SECONDS.
    location = /api/logs/analyze {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://smartlog_api;
        proxy_read_timeout 90s;
    }

    # Interactive API docs (Swagger UI) and the OpenAPI document.
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://smartlog_api;
    }

    # ---- Web UI (static build of src/frontend) ----
    # Security headers are set per location: add_header at server level would also apply
    # to /docs, whose Swagger UI loads scripts from a CDN.
    root /usr/share/nginx/html;

    # Hashed assets never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated so a deploy is picked up at once.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        try_files $uri /index.html;
    }
}
